name: CASCO official document change watch

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: casco-official-document-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      CASCO_AI_PROVIDER: auto
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-casco.txt
      - name: Cache document parser models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: docling-models-v2
      - name: Check official documents and reprocess changed sources only
        run: python scripts/casco_nightly_watch.py
      - name: Upload watch report even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casco-nightly-watch
          path: work/casco-nightly-watch/
          retention-days: 90
