name: Daily CASCO collection
on:
  schedule:
    # 06:00 Moscow time.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      insurer:
        description: Optional insurer slug; empty means all 11
        required: false
        type: string
      retry_failed:
        description: Retry unchanged documents with a previous failed attempt
        type: boolean
        default: false
      max_documents:
        description: Maximum documents to analyze (0 = check only)
        type: string
        default: "1"

concurrency:
  group: daily-casco-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      INSURER: ${{ inputs.insurer }}
      RETRY_FAILED: ${{ inputs.retry_failed }}
      MAX_DOCUMENTS: ${{ inputs.max_documents || '1' }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight dependencies
        run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest tests.test_casco_documents tests.test_casco_optimization
      - name: Check pinned document SHA-256
        id: checksum
        shell: bash
        run: |
          args=()
          if [ -n "$INSURER" ]; then args+=(--insurer "$INSURER"); fi
          if [ "$RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          args+=(--max-documents "$MAX_DOCUMENTS")
          python scripts/casco_documents.py check "${args[@]}"
      - name: Cache Docling models
        if: steps.checksum.outputs.pending != '0' && (env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '')
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: docling-models-v2
      - name: Install Docling only when analysis is needed
        if: steps.checksum.outputs.pending != '0' && (env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '')
        run: pip install -r requirements-casco.txt
      - name: Analyze changed or deferred documents
        if: steps.checksum.outputs.pending != '0'
        run: python scripts/casco_documents.py analyze
      - name: Upload check and analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casco-document-report
          path: |
            work/casco/manifest.json
            work/casco/report.json
          retention-days: 14
      - name: Audit existing cards
        if: always()
        run: python scripts/qa_casco_facts.py
