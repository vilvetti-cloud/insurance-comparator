name: Daily CASCO collection

on:
  push:
    branches:
      - main
    paths:
      - "collector/**"
      - "!collector/property_*.py"
      - "core/**"
      - "!core/property_*.py"
      - "!core/services/property_*.py"
      - "!core/services/reso_property_*.py"
      - "database/**"
      - "scripts/run_collection.py"
      - "scripts/qa_comparisons.py"
      - ".github/workflows/daily-collection.yml"
      - "requirements.txt"
  schedule:
    # 03:00 UTC every day (06:00 Moscow time).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      insurer:
        description: "Optional insurer slug; leave empty to collect all 11"
        required: false
        type: string

concurrency:
  group: daily-casco-collection
  cancel-in-progress: true

jobs:
  collect:
    name: Collect ${{ matrix.insurer }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        insurer:
          - reso
          - vsk
          - ingos
          - renins
          - alfa
          - soglasie
          - rgs
          - t-insurance
          - sber
          - yugoria
          - sovcom

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      COLLECTION_TRIGGER: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile collector
        run: python -m py_compile collector/*.py core/*.py database/repositories/*.py

      - name: Smoke test extraction and comparison quality
        run: python -m unittest tests.test_deterministic tests.test_evidence_quality tests.test_condition_audit tests.test_sales_insights tests.test_comparison_qa tests.test_sales_script_ai tests.test_property_catalog tests.test_property_schema_service tests.test_property_source_map tests.test_property_reso_baseline tests.test_reso_property_baseline_loader

      - name: Run collection
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.insurer == '' || inputs.insurer == matrix.insurer }}
        run: python scripts/run_collection.py --insurer "${{ matrix.insurer }}"


  comparison-qa:
    name: QA all 110 comparisons
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Audit all 110 CASCO facts
        run: python scripts/qa_casco_facts.py

      - name: Validate all directed comparisons
        run: python scripts/qa_comparisons.py --fail-on-errors
