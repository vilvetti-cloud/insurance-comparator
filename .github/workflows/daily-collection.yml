name: Daily CASCO collection

on:
  schedule:
    # 03:00 UTC every day (06:00 Moscow time).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      insurer:
        description: "Optional insurer slug; leave empty to collect all 11"
        required: false
        type: string

concurrency:
  group: daily-casco-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      COLLECTION_TRIGGER: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run collection
        env:
          INSURER_INPUT: ${{ inputs.insurer }}
        run: |
          set -euo pipefail
          if [ -n "${INSURER_INPUT:-}" ]; then
            python scripts/run_collection.py --insurer "$INSURER_INPUT"
          else
            python scripts/run_collection.py
          fi
