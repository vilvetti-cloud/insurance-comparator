name: Auto-update self-test
# Real AI request on a copy of RESO's rules with two edited clauses.
# Changes nothing in the repository; results appear as annotations.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/answer_writer.py"
      - "collector/free_ai.py"
      - "scripts/auto_update_selftest.py"
      - ".github/workflows/auto-update-selftest.yml"

permissions:
  contents: read
  # GitHub Models: a free AI in the chain, no sign-up (collector/free_ai.py).
  models: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      # The other free AI services, asked in turn when one is busy (collector/free_ai.py).
      GITHUB_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt anthropic
      - run: python scripts/auto_update_selftest.py
