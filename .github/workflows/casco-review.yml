name: Explicit CASCO review
on:
  workflow_dispatch:
    inputs:
      insurer:
        description: Insurer slug, or all for deterministic review without AI
        type: string
        required: true
        default: t-insurance
      apply:
        description: Publish only candidates that pass the evidence gate
        type: boolean
        default: false
      ai:
        description: Extract failed fields from one cached document
        type: boolean
        default: false
      model:
        description: Optional Gemini model for this manual run only
        type: string
        required: false
  push:
    paths:
      - .github/casco-soglasie-pilot.txt
concurrency:
  group: daily-casco-collection
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL }}
      INSURER: ${{ github.event_name == 'push' && 'soglasie' || inputs.insurer }}
      APPLY: ${{ github.event_name == 'push' && 'true' || inputs.apply }}
      USE_AI: ${{ github.event_name == 'push' && 'true' || inputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Review cached extraction
        shell: bash
        run: |
          args=(--insurer "$INSURER")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          if [ "$USE_AI" = true ]; then args+=(--ai); fi
          python scripts/casco_review.py "${args[@]}"
      - name: Upload full review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casco-review-report
          path: casco-review-report.json

