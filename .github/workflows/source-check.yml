name: Nightly rules check on insurer sites
on:
  schedule:
    # 06:00 Moscow time.
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Rules downloaded by the owner's PC (sites closed to servers abroad).
  push:
    branches: [main]
    paths: ["data/incoming/**"]

permissions:
  contents: write
  issues: write
  # GitHub Models: a free AI in the chain, no sign-up (collector/free_ai.py).
  models: read

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    # Up to 3 nightly attempts across several free AI services can take a while.
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Free alternative used when no Claude key is set.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      # The other free AI services, asked in turn when one is busy (collector/free_ai.py).
      GITHUB_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DOWNLOADS: ${{ github.event_name == 'push' && 'data/incoming' || 'work/downloads' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt anthropic pytest
      - name: Download rules from insurer sites and compare with our copies
        if: github.event_name != 'push'
        run: python scripts/check_sources.py --downloads work/downloads
      - name: Update answers from changed rules
        # A failure here must not stop the nightly date from being published.
        continue-on-error: true
        run: python scripts/auto_update.py --downloads "$DOWNLOADS" --summary work/auto-update-summary.md
      - name: Verify updated answers
        # The site's own tests must still pass with the new answers;
        # otherwise the answers are rolled back and the owner is told.
        shell: bash
        run: |
          if git diff --quiet -- data/casco-comparison-master.json; then
            echo "Answers unchanged"
            exit 0
          fi
          if python -m pytest -q; then
            exit 0
          fi
          git checkout -- data/casco-comparison-master.json data/sources docs/source-urls.md
          {
            echo ""
            echo "**Внимание:** после автообновления не прошли проверки сайта, новые ответы откатены."
            echo "Старые ответы оставлены; нужен ручной разбор."
          } >> work/auto-update-summary.md
      - name: Publish the result to the site
        # The site shows the check date even when nothing changed, so the
        # result is committed every night; the push redeploys the site.
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Files handed over by the PC are analysed now; the copy lives in data/sources.
          rm -rf data/incoming
          git add -A -- data docs/source-urls.md
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          if git diff --cached --quiet -- data/casco-comparison-master.json; then
            git commit -m "Ночная проверка правил на сайтах страховых"
          else
            git commit -m "Автообновление ответов по новой редакции правил"
          fi
          # A busy GitHub or a commit pushed meanwhile (the owner's PC): try again.
          for attempt in 1 2 3; do
            if out=$(git pull --rebase origin main 2>&1 && git push origin HEAD:main 2>&1); then
              exit 0
            fi
            echo "$out"
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          # The reason is kept as an annotation: logs are visible to repository admins only.
          echo "::error::Публикация не удалась: $(echo "$out" | tail -4 | tr '\n' ' ')"
          exit 1
      - name: Email the owner about changes
        # A new issue sends an email to the repository owner.
        if: hashFiles('work/auto-update-summary.md') != ''
        # A block scalar: the title has ": ", which YAML would read as a mapping.
        run: |
          title="Правила КАСКО: изменения от $(date +%d.%m.%Y)"
          [ -s work/auto-update-title.txt ] && title="$(cat work/auto-update-title.txt)"
          gh issue create --title "$title" --body-file work/auto-update-summary.md
      - name: Email the owner when the nightly check itself failed
        # Owner's request (05.11.2026): a check that broke must never stay silent.
        if: failure()
        run: |
          body="Ночная проверка остановилась с ошибкой: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$body — данные на сайте остались вчерашними. Откройте Claude Code и напишите: «ночная проверка упала, разберись»."
          gh issue create --title "Ночная проверка правил не завершилась $(date +%d.%m.%Y)" --body "$body"
      - name: Monthly reminder for sites closed to programs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          [ "$(date +%d)" = "01" ] || exit 0
          python scripts/manual_reminder.py > work/reminder.md
          [ -s work/reminder.md ] || exit 0
          gh issue create --title "Проверьте правила вручную: $(date +%m.%Y)" --body-file work/reminder.md
