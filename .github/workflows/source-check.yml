name: Nightly rules check on insurer sites
on:
  schedule:
    # 06:00 Moscow time.
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Rules downloaded by the owner's PC (sites closed to servers abroad).
  push:
    branches: [main]
    paths: ["data/incoming/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Free alternative used when no Claude key is set.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      DOWNLOADS: ${{ github.event_name == 'push' && 'data/incoming' || 'work/downloads' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt anthropic pytest
      - name: Download rules from insurer sites and compare with our copies
        if: github.event_name != 'push'
        run: python scripts/check_sources.py --downloads work/downloads
      - name: Update answers from changed rules
        # A failure here must not stop the nightly date from being published.
        continue-on-error: true
        run: python scripts/auto_update.py --downloads "$DOWNLOADS" --summary work/auto-update-summary.md
      - name: Verify updated answers
        # The site's own tests must still pass with the new answers;
        # otherwise the answers are rolled back and the owner is told.
        shell: bash
        run: |
          if git diff --quiet -- data/casco-comparison-master.json; then
            echo "Answers unchanged"
            exit 0
          fi
          if python -m pytest -q; then
            exit 0
          fi
          git checkout -- data/casco-comparison-master.json data/sources docs/source-urls.md
          {
            echo ""
            echo "**Внимание:** после автообновления не прошли проверки сайта, новые ответы откатены."
            echo "Старые ответы оставлены; нужен ручной разбор."
          } >> work/auto-update-summary.md
      - name: Publish the result to the site
        # The site shows the check date even when nothing changed, so the
        # result is committed every night; the push redeploys the site.
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Files handed over by the PC are analysed now; the copy lives in data/sources.
          rm -rf data/incoming
          git add -A -- data docs/source-urls.md
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          if git diff --cached --quiet -- data/casco-comparison-master.json; then
            git commit -m "Ночная проверка правил на сайтах страховых"
          else
            git commit -m "Автообновление ответов по новой редакции правил"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Email the owner about changes
        # A new issue sends an email to the repository owner.
        if: hashFiles('work/auto-update-summary.md') != ''
        run: gh issue create --title "Правила КАСКО: изменения от $(date +%d.%m.%Y)" --body-file work/auto-update-summary.md
      - name: Monthly reminder for sites closed to programs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          [ "$(date +%d)" = "01" ] || exit 0
          python scripts/manual_reminder.py > work/reminder.md
          [ -s work/reminder.md ] || exit 0
          gh issue create --title "Проверьте правила вручную: $(date +%m.%Y)" --body-file work/reminder.md
