name: T-insurance answer pilot
on:
  workflow_dispatch:
    inputs:
      field:
        description: One CASCO field key or all fields
        type: string
        default: all
      start_field:
        description: Resume all-fields pilot from this field
        type: string
        required: false
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PILOT_FIELD: ${{ inputs.field || 'all' }}
      PILOT_START_FIELD: ${{ inputs.start_field }}
      GROQ_STRICT: 'false'
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/casco_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t-insurance-pilot-report
          path: casco-pilot-report.json
