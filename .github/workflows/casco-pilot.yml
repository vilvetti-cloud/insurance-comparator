name: T-insurance answer pilot
on:
  push:
    paths:
      - .github/casco-pilot-trigger.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/casco_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t-insurance-pilot-report
          path: casco-pilot-report.json
