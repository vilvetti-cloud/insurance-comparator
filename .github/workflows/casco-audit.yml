name: CASCO content audit

on:
  push:
    branches:
      - main
    paths:
      - "scripts/audit_casco_values.py"
      - "collector/deterministic.py"
      - "core/evidence_quality.py"
      - "core/condition_audit.py"
      - "core/services/data_quality_report_service.py"
      - "tests/test_deterministic.py"
      - "tests/test_condition_audit.py"
      - ".github/workflows/casco-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Audit current CASCO values
        run: python scripts/audit_casco_values.py
