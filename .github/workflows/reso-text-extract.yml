name: Temporary RESO PDF text extraction
on:
  pull_request:
    paths:
      - ".github/workflows/reso-text-extract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf
      - name: Extract complete PDF text for analysis
        run: |
          python - <<'PY'
          import fitz
          path = "data/sources/reso/technical.pdf"
          doc = fitz.open(path)
          print(f"PDF_PAGE_COUNT={doc.page_count}")
          for i, page in enumerate(doc):
              print(f"\n===== PDF PAGE {i+1} =====\n")
              print(page.get_text("text"))
          PY
