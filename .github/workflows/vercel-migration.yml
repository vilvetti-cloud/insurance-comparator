name: Apply Vercel migration edits

on:
  push:
    branches:
      - vercel-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'chore: finish vercel migration setup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Vercel-safe changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "# Автоматический сбор при запуске\nUPDATE_ON_START = True",
              "# Автоматический сбор при запуске отключён для serverless-среды Vercel.\nUPDATE_ON_START = False",
              1,
          )

          start_marker = "# ============================================================\n# ШАБЛОНЫ\n# ============================================================"
          end_marker = "# ============================================================\n# ЗАПУСК\n# ============================================================"

          start = text.find(start_marker)
          end = text.find(end_marker)

          if start == -1 or end == -1 or end <= start:
              raise SystemExit("Не удалось найти блок генерации шаблонов")

          text = text[:start] + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          cat > pyproject.toml <<'EOF'
          [project]
          name = "insurance-comparator"
          version = "0.1.0"
          requires-python = "~=3.12.0"
          dependencies = [
            "flask",
            "requests",
            "beautifulsoup4",
            "PyPDF2",
            "pypdf",
          ]
          EOF

          rm -f .github/workflows/vercel-migration.yml

      - name: Commit migration changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pyproject.toml .github/workflows/vercel-migration.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: finish vercel migration setup"
          git push
