name: T-insurance verified card repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CASCO_SOURCE_PROBE: 'true'
      CASCO_DETERMINISTIC_ONLY: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate targeted extraction and preservation
        run: python -m unittest tests.test_casco_repair
      - name: Repair failed fields from cached official PDF
        run: python scripts/casco_repair.py
      - name: Upload answer and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-insurance-repair-report
          path: casco-repair-report.json
      - name: Audit active cards
        if: always()
        run: python scripts/qa_casco_facts.py

