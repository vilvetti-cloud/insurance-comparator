name: Property collection pilot

on:
  push:
    branches:
      - main
    paths:
      - "collector/property_pipeline.py"
      - "collector/property_llm.py"
      - "collector/property_relevance.py"
      - "collector/property_competitor_registry.py"
      - "core/property_catalog.py"
      - "core/property_reso_baseline.py"
      - "core/property_source_map.py"
      - "core/property_condition_audit.py"
      - "core/services/property_schema_service.py"
      - "core/services/reso_property_baseline_loader.py"
      - "database/schema.sql"
      - "database/repositories/condition.py"
      - "database/repositories/field.py"
      - "database/repositories/product.py"
      - "scripts/load_reso_property_baseline.py"
      - "scripts/run_property_collection.py"
      - ".github/workflows/property-collection.yml"
  workflow_dispatch:

concurrency:
  group: property-collection-pilot
  cancel-in-progress: true

jobs:
  seed-reso:
    name: Seed RESO apartment + house
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate and load RESO property baseline
        run: python scripts/load_reso_property_baseline.py

  collect:
    name: Collect ${{ matrix.insurer }} / ${{ matrix.scenario }}
    needs: seed-reso
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - insurer: sovcom
            scenario: apartment
          - insurer: sovcom
            scenario: house

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile property collector
        run: python -m py_compile collector/property_*.py core/property_*.py core/services/property_*.py database/repositories/*.py scripts/run_property_collection.py

      - name: Run first competitor collector
        run: python scripts/run_property_collection.py --insurer "${{ matrix.insurer }}" --scenario "${{ matrix.scenario }}"
