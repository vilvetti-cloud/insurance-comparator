name: CASCO document pipeline tests
on:
  push:
    branches: [main]
    paths: ["collector/**", "core/**", "database/**", "tests/**", "scripts/casco_documents.py", "requirements-casco.txt", ".github/workflows/casco-documents-ci.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: casco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/casco_test
      CASCO_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCLING_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-casco.txt
      - run: python -m unittest tests.test_docling_smoke
