name: Accounts on YDB
# The accounts tests against the real YDB in Yandex Cloud, each test in its own
# temporary tables (prefix t<random>_), so the site's tables are not touched.
# Needs the secrets ACCOUNTS_YDB_URL and YDB_SERVICE_ACCOUNT_KEY; without them it is skipped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/accounts.py"
      - "core/accounts_ydb.py"
      - "web_accounts.py"
      - "tests/test_accounts.py"
      - ".github/workflows/accounts-ydb.yml"

permissions:
  contents: read

jobs:
  ydb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACCOUNTS_TEST_DATABASE_URL: ${{ secrets.ACCOUNTS_YDB_URL }}
      YDB_SERVICE_ACCOUNT_KEY: ${{ secrets.YDB_SERVICE_ACCOUNT_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Accounts tests on YDB
        shell: bash
        run: |
          if [ -z "$ACCOUNTS_TEST_DATABASE_URL" ] || [ -z "$YDB_SERVICE_ACCOUNT_KEY" ]; then
            echo "::notice::Секреты YDB не заданы — проверка пропущена"
            exit 0
          fi
          python -m pytest -q tests/test_accounts.py
