[project]
name = "insurance-comparator"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
  "flask",
  "requests",
  "beautifulsoup4",
  "pypdf",
  "PyMuPDF",
  "psycopg[binary]>=3.2,<4",
  # Accounts in Yandex Cloud YDB: personal data stays in Russia (core/accounts_ydb.py).
  "ydb>=3.34,<4",
  # Caching and rate limiting.
  "redis>=5.0.0,<6",
  "flask-limiter>=3.5.0,<4",
  # Structured logging.
  "structlog>=24.1.0,<25",
  # Config validation.
  "pydantic-settings>=2.2.0,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pre-commit>=3.8.0",
]

[tool.vercel]
entrypoint = "vercel_db_entry:app"

[tool.pytest.ini_options]
# The ydb package installs a top-level «tests» package; ours must come first.
pythonpath = ["."]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=0 -q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "W",      # pycodestyle warnings
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific rules
  "FURB",   # refurb
  "D",      # pydocstyle
  "PTH",    # use pathlib over os.path
]
ignore = [
  "D100",   # missing docstring in public module
  "D104",   # missing docstring in public package
  "D107",   # missing docstring in __init__
  "D203",   # one-blank-line-before-class
  "D213",   # multi-line-summary-second-line
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "S101"]
"scripts/**/*.py" = ["D103"]
"collector/**/*.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
exclude = ["^.venv/"]
