<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body{font-family:Arial;padding:20px;background:#f5f5f5}
        .container{max-width:400px;margin:0 auto;background:white;padding:20px;border-radius:10px}
        input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
        button{width:100%;padding:12px;background:#3498db;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
        a{color:#3498db;text-decoration:none}
    </style>
</head>
<body>
<div class="container">
    <h2>🔑 Вход</h2>
    <form method="post">
        <input type="text" name="username" placeholder="Имя пользователя" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    <p style="text-align:center;margin-top:15px;"><a href="/register">Нет аккаунта? Зарегистрироваться</a></p>
</div>
</body>
</html>
