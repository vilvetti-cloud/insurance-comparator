<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подготовка к продаже</title>
    <style>
        :root{--green:#009639;--lime:#43B02A;--ink:#12231c;--muted:#65736c}
        *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,rgba(67,176,42,.18),transparent 35%),radial-gradient(circle at 85% 85%,rgba(0,150,57,.14),transparent 35%),linear-gradient(135deg,#eef7f1,#f7faf8);padding:28px 18px}
        .wrap{width:min(680px,100%);margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:50px}.brand{font-weight:800;letter-spacing:-.03em}.back{color:#607067;text-decoration:none;font-size:13px;font-weight:700}.back:hover{color:var(--green)}
        .hero{text-align:center;margin-bottom:24px}.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.5);border:1px solid rgba(0,150,57,.14);color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:clamp(34px,7vw,52px);letter-spacing:-.055em;line-height:1;margin:16px 0 10px}.hero p{color:var(--muted);margin:0;font-size:15px;line-height:1.5}
        .card{padding:30px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.7);border-radius:28px;box-shadow:0 28px 80px rgba(22,57,39,.12),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
        .label{display:block;margin:0 0 9px 3px;color:#385146;font-size:13px;font-weight:800}.select-wrap{position:relative}.select-wrap:after{content:"⌄";position:absolute;right:17px;top:50%;transform:translateY(-53%);color:#65736c;pointer-events:none}.select-wrap select{width:100%;appearance:none;border:1px solid rgba(67,97,81,.16);border-radius:16px;padding:16px 44px 16px 16px;font:inherit;background:rgba(255,255,255,.68);color:var(--ink);outline:none}.select-wrap select:focus{border-color:rgba(0,150,57,.55);box-shadow:0 0 0 4px rgba(0,150,57,.09)}.vs{display:flex;align-items:center;gap:12px;margin:18px 0;color:#91a098;font-size:11px;font-weight:800}.vs:before,.vs:after{content:"";height:1px;flex:1;background:rgba(82,111,95,.13)}
        .btn{width:100%;margin-top:24px;border:0;border-radius:16px;padding:16px;color:white;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--lime),var(--green));box-shadow:0 14px 30px rgba(0,150,57,.24);transition:.18s}.btn:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(0,150,57,.3)}.hint{text-align:center;color:#819087;font-size:11px;margin-top:16px}
    </style>
</head>
<body><div class="wrap">
    <nav class="nav"><div class="brand">Страховой аналитик</div><a class="back" href="/">← Назад</a></nav>
    <section class="hero"><div class="eyebrow">Новый сценарий</div><h1>Подготовка к продаже</h1><p>Выберите свою страховую и конкурента — система найдёт сильные стороны вашего предложения.</p></section>
    <div class="card"><form method="POST" action="/compare">
        <label class="label" for="main_company">Ваша страховая</label><div class="select-wrap"><select id="main_company" name="main_company" required><option value="">Выберите компанию</option>{% for c in companies %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
        <div class="vs"><span>VS</span></div>
        <label class="label" for="company2">Конкурент</label><div class="select-wrap"><select id="company2" name="company2" required><option value="">Выберите компанию</option>{% for c in companies %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
        <button class="btn" type="submit">Найти аргументы для клиента →</button><div class="hint">Результат будет основан на актуальных данных и источниках.</div>
    </form></div>
</div></body></html>
