<!DOCTYPE html>
<html>
<head><title>Сравнение КАСКО</title>
<style>
body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; }
h1 { color: #2c3e50; text-align: center; }
.selector { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 20px 0; background: #f9f9f9; }
select { padding: 10px; font-size: 16px; width: 100%; margin: 10px 0; border-radius: 4px; }
.button { background: #27ae60; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; width: 100%; }
.button:hover { background: #219a52; }
.header { text-align: center; margin-bottom: 30px; }
.vs { text-align: center; font-size: 24px; color: #e74c3c; margin: 10px 0; }
.meta { text-align: center; color: #888; font-size: 12px; margin-top: 20px; }
.update-btn { background: #f39c12; color: white; padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
.update-btn:hover { background: #e67e22; }
</style></head>
<body>
    <div class="header">
        <h1>🔍 Сравнение КАСКО</h1>
        <p>Выберите две страховые компании для сравнения</p>
        <div style="font-size: 12px; color: #27ae60; margin: 5px 0;">
            ✅ Данные обновляются автоматически каждый день в 8:00
        </div>
        <div style="font-size: 12px; color: #888;">
            Последнее обновление: {{ data_updated }}
        </div>
        <button class="update-btn" onclick="location.href='/update'">🔄 Обновить сейчас</button>
    </div>
    <form action="/compare" method="get">
        <div class="selector">
            <label><strong>Компания А:</strong></label>
            <select name="company1" required>
                <option value="">-- Выберите компанию --</option>
                {% for company in companies %}
                <option value="{{ company }}">{{ company }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="vs">⚔️ VS ⚔️</div>
        <div class="selector">
            <label><strong>Компания Б:</strong></label>
            <select name="company2" required>
                <option value="">-- Выберите компанию --</option>
                {% for company in companies %}
                <option value="{{ company }}">{{ company }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="button">Сравнить →</button>
    </form>
    <div class="meta">Источники: kaskometr.ru, finuslugi.ru, новостные сайты</div>
</body></html>
