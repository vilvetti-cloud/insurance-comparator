<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение КАСКО</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 480px; width: 100%; text-align: center; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #218838; }
        .footer-info { margin-top: 25px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔍 Сравнение страховых компаний</h1>
    <form action="/compare" method="POST">
        <div class="form-group">
            <label>Первая компания:</label>
            <select name="company1" required>
                <option value="" disabled selected>Выберите компанию...</option>
                {% for company in companies %}
                    <option value="{{ company }}">{{ company }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Вторая компания:</label>
            <select name="company2" required>
                <option value="" disabled selected>Выберите компанию...</option>
                {% for company in companies %}
                    <option value="{{ company }}">{{ company }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn">📊 Сравнить</button>
    </form>
    <div class="footer-info">Данные обновлены: {{ last_updated }}</div>
</div>
</body>
</html>
