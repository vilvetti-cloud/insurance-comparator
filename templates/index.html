<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение КАСКО</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #218838; }
        .footer-info { margin-top: 25px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔍 Сравнение КАСКО</h1>
    <div class="subtitle">Сравни условия страховых компаний</div>

    <form action="/compare" method="POST">
        <div class="form-group">
            <label for="company1">Первая страховая компания:</label>
            <select name="company1" id="company1" required>
                <option value="" disabled selected>Выберите компанию...</option>
                {% for company in companies %}
                    <option value="{{ company }}">{{ company }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="company2">Вторая страховая компания:</label>
            <select name="company2" id="company2" required>
                <option value="" disabled selected>Выберите компанию...</option>
                {% for company in companies %}
                    <option value="{{ company }}">{{ company }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn-submit">📊 Сравнить компании</button>
    </form>

    <div class="footer-info">
        Обновлено: {{ last_updated }}
    </div>
</div>

</body>
</html>
